version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# NetGuard IDS — PostgreSQL override (Decision D-010)
#
# Extends docker-compose.yml with PostgreSQL for production / real-life
# deployment. NOT used for the academic A2 submission.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL — production DB ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: netguard-db
    environment:
      POSTGRES_USER: netguard
      POSTGRES_PASSWORD: netguard_dev
      POSTGRES_DB: netguard
    volumes:
      - netguard_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netguard -d netguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Override api to use PostgreSQL ────────────────────────────────────────
  api:
    environment:
      - DATABASE_URL=postgresql+asyncpg://netguard:netguard_dev@db:5432/netguard
    depends_on:
      db:
        condition: service_healthy

volumes:
  netguard_pg:
