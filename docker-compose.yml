version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# NetGuard IDS — Docker Compose  (SQLite / local-demo stack)
#
# DEFAULT: Runs 3 services — api, ui, mcp — using SQLite for persistence.
# No separate database container is needed.
#
#   bash ops.sh start --docker        # builds + starts these 3 services
#
# For the PostgreSQL production stack (Decision D-010, future deployment):
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up
#
# For local dev without Docker (academic submission default):
#   bash ops.sh start                 # uses SQLite via .env DATABASE_URL
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI inference + training backend ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netguard-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    env_file:
      - .env   # uses SQLite by default (DATABASE_URL=sqlite+aiosqlite:///./netguard_dev.db)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Nginx UI ──────────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: netguard-ui
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── FastMCP tool server ───────────────────────────────────────────────────
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netguard-mcp
    command: python -m mcp_server.server
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - APP_PORT=8000
      - MCP_PORT=8001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
