version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# NetGuard IDS — Docker Compose
#
# CURRENT DEFAULT (local dev / academic submission):
#   Run locally with SQLite — no Docker needed:
#     bash ops.sh start
#
# THIS FILE runs the full 4-service Docker stack and uses PostgreSQL as the
# operational DB (Decision D-010, queued for production deployment).
# PostgreSQL is NOT used in the academic submission; it is retained here as
# an architectural extension point for a production / real-life deployment.
#
# To run the Docker stack:
#     bash ops.sh start --docker
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL — production DB (D-010, future / real-life deployment only) ─
  # Not used in the academic submission. SQLite (netguard_dev.db) is the
  # default for local development and the A2 coursework demo.
  db:
    image: postgres:16-alpine
    container_name: netguard-db
    environment:
      POSTGRES_USER: netguard
      POSTGRES_PASSWORD: netguard_dev
      POSTGRES_DB: netguard
    volumes:
      - netguard_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netguard -d netguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── FastAPI inference + training backend ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netguard-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    env_file:
      - .env
    environment:
      # Overrides .env SQLite default → PostgreSQL when running via Docker
      - DATABASE_URL=postgresql+asyncpg://netguard:netguard_dev@db:5432/netguard
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Nginx UI ──────────────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: netguard-ui
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── FastMCP tool server ───────────────────────────────────────────────────────
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netguard-mcp
    command: python -m mcp_server.server
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - APP_PORT=8000
      - MCP_PORT=8001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  netguard_pg:
